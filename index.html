<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vincere Thumbnail</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Georgia', serif;
    }

    .canvas {
      width: 900px;
      height: 900px;
      background: #0d0d0d;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    /* Subtle vignette overlay */
    .canvas::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
      pointer-events: none;
      z-index: 10;
    }

    /* Top label */
    .top-label {
      font-family: 'Georgia', serif;
      font-size: 11px;
      letter-spacing: 0.25em;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      margin-bottom: 14px;
      position: relative;
      z-index: 20;
    }

    /* Photo collage */
    .collage {
      width: 700px;
      height: 460px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 5px;
      position: relative;
      z-index: 20;
    }

    .collage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.82) contrast(1.08) saturate(0.9);
      display: block;
    }

    .collage img:nth-child(1) { border-radius: 4px 0 0 0; }
    .collage img:nth-child(2) { border-radius: 0 4px 0 0; }
    .collage img:nth-child(3) { border-radius: 0 0 0 4px; }
    .collage img:nth-child(4) { border-radius: 0 0 4px 0; }

    /* Red line divider */
    .divider {
      width: 52px;
      height: 3px;
      background: #c0392b;
      margin: 20px auto 16px;
      position: relative;
      z-index: 20;
    }

    /* Main title */
    .title {
      font-family: 'Georgia', serif;
      font-size: 58px;
      font-weight: bold;
      letter-spacing: 0.18em;
      color: #ffffff;
      text-transform: uppercase;
      text-align: center;
      line-height: 1;
      position: relative;
      z-index: 20;
    }

    /* Subtitle */
    .subtitle {
      font-family: 'Georgia', serif;
      font-size: 13px;
      letter-spacing: 0.22em;
      color: rgba(255,255,255,0.45);
      text-transform: uppercase;
      text-align: center;
      margin-top: 12px;
      position: relative;
      z-index: 20;
    }

    /* Bottom tagline */
    .tagline {
      font-family: 'Georgia', serif;
      font-size: 11.5px;
      letter-spacing: 0.12em;
      color: #c0392b;
      text-align: center;
      margin-top: 18px;
      font-style: italic;
      position: relative;
      z-index: 20;
    }

    /* Corner ornaments */
    .corner {
      position: absolute;
      width: 28px;
      height: 28px;
      z-index: 20;
    }
    .corner.tl { top: 18px; left: 18px; border-top: 1.5px solid rgba(192,57,43,0.5); border-left: 1.5px solid rgba(192,57,43,0.5); }
    .corner.tr { top: 18px; right: 18px; border-top: 1.5px solid rgba(192,57,43,0.5); border-right: 1.5px solid rgba(192,57,43,0.5); }
    .corner.bl { bottom: 18px; left: 18px; border-bottom: 1.5px solid rgba(192,57,43,0.5); border-left: 1.5px solid rgba(192,57,43,0.5); }
    .corner.br { bottom: 18px; right: 18px; border-bottom: 1.5px solid rgba(192,57,43,0.5); border-right: 1.5px solid rgba(192,57,43,0.5); }
  </style>
</head>
<body>

  <div class="canvas">

    <!-- Corner ornaments -->
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <!-- Top label -->
    <p class="top-label">Vincere Publishing</p>

    <!-- 4-photo collage -->
    <div class="collage">
      <img src="1.png" alt="Law 1" />
      <img src="2.png" alt="Law 2" />
      <img src="3.png" alt="Law 3" />
      <img src="4.png" alt="Law 4" />
    </div>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- Title -->
    <h1 class="title">Vincere</h1>

    <!-- Subtitle -->
    <p class="subtitle">10 Laws of Power &amp; Strategy</p>

    <!-- Tagline -->
    <p class="tagline">History's greatest conquerors. Your daily playbook.</p>

  </div>

</body>
</html>
