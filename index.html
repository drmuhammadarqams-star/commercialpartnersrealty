<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vincere Thumbnail</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* The entire 900x900 canvas */
    .canvas {
      width: 900px;
      height: 900px;
      background: #0d0d0d;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ROW 1 — top label: 38px */
    .row-top {
      height: 38px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .row-top span {
      font-family: Georgia, serif;
      font-size: 10px;
      letter-spacing: 0.28em;
      color: rgba(255,255,255,0.28);
      text-transform: uppercase;
    }

    /* ROW 2 — collage: 560px */
    .row-collage {
      height: 560px;
      flex-shrink: 0;
      padding: 0 50px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 5px;
    }

    .row-collage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.78) contrast(1.1) saturate(0.85);
      display: block;
    }

    .row-collage img:nth-child(1) { border-radius: 3px 0 0 0; }
    .row-collage img:nth-child(2) { border-radius: 0 3px 0 0; }
    .row-collage img:nth-child(3) { border-radius: 0 0 0 3px; }
    .row-collage img:nth-child(4) { border-radius: 0 0 3px 0; }

    /* ROW 3 — text block: 302px (fills the rest) */
    .row-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      background: #0d0d0d;
    }

    .divider {
      width: 48px;
      height: 3px;
      background: #c0392b;
      margin-bottom: 16px;
    }

    .title {
      font-family: Georgia, serif;
      font-size: 68px;
      font-weight: bold;
      letter-spacing: 0.18em;
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 14px;
    }

    .subtitle {
      font-family: Georgia, serif;
      font-size: 12px;
      letter-spacing: 0.24em;
      color: rgba(255,255,255,0.38);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .tagline {
      font-family: Georgia, serif;
      font-size: 11px;
      letter-spacing: 0.1em;
      color: #c0392b;
      font-style: italic;
    }

    /* Corner ornaments — decorative only, on top of everything */
    .corner {
      position: absolute;
      width: 28px;
      height: 28px;
      z-index: 20;
    }
    .tl { top: 14px; left: 14px; border-top: 2px solid rgba(192,57,43,0.55); border-left: 2px solid rgba(192,57,43,0.55); }
    .tr { top: 14px; right: 14px; border-top: 2px solid rgba(192,57,43,0.55); border-right: 2px solid rgba(192,57,43,0.55); }
    .bl { bottom: 14px; left: 14px; border-bottom: 2px solid rgba(192,57,43,0.55); border-left: 2px solid rgba(192,57,43,0.55); }
    .br { bottom: 14px; right: 14px; border-bottom: 2px solid rgba(192,57,43,0.55); border-right: 2px solid rgba(192,57,43,0.55); }

    /* Vignette over whole canvas */
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.5) 100%);
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="canvas">

    <!-- Vignette overlay -->
    <div class="vignette"></div>

    <!-- Corner ornaments -->
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <!-- Row 1: label -->
    <div class="row-top">
      <span>Vincere Publishing</span>
    </div>

    <!-- Row 2: 4 images -->
    <div class="row-collage">
      <img src="1.jpeg" alt="" />
      <img src="2.jpeg" alt="" />
      <img src="3.jpeg" alt="" />
      <img src="4.jpeg" alt="" />
    </div>

    <!-- Row 3: text -->
    <div class="row-text">
      <div class="divider"></div>
      <h1 class="title">Vincere</h1>
      <p class="subtitle">10 Laws of Power &amp; Strategy</p>
      <p class="tagline">History's greatest conquerors. Your daily playbook.</p>
    </div>

  </div>
</body>
</html>
